<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Smart Parking Lot</title><style>body{font:16px system-ui;background:#f2f5f8;color:#172b40;max-width:900px;margin:40px auto;padding:16px}section{background:white;padding:24px;border-radius:12px;margin:16px 0}input,select,button{font:inherit;padding:10px;margin:4px;border:1px solid #aab7c4;border-radius:6px}button{background:#174f72;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}</style><h1>Smart Parking Lot</h1><p>Java backend demonstration · live availability</p><section><h2>Check in</h2><form id="entry"><input name="plate" placeholder="Vehicle registration" required><select name="type"><option>CAR</option><option>MOTORCYCLE</option><option>BUS</option></select><button>Allocate spot</button></form><h2>Check out</h2><form id="exit"><input name="ticket" placeholder="Ticket ID" required><button>Calculate fee &amp; exit</button></form><pre id="output" aria-live="polite"></pre></section><section><h2>Availability</h2><table><thead><tr><th>Floor</th><th>Size</th><th>Available</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></section><script>async function refresh(){try{const r=await fetch('/api/availability');if(!r.ok)return;const data=await r.json();document.querySelector('#rows').replaceChildren(...data.map(a=>{const tr=document.createElement('tr');for(const v of [a.floor,['','Small','Medium','Large'][a.sizeRank],a.available,a.total]){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}))}catch{}}for(const [id,path] of [['entry','check-in'],['exit','check-out']]){document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/'+path,{method:'POST',body:new URLSearchParams(new FormData(e.target))});const data=await r.json();document.getElementById('output').textContent=JSON.stringify(data,null,2);if(r.ok&&id==='entry')document.querySelector('[name=ticket]').value=data.ticketId;refresh()}catch(err){document.getElementById('output').textContent=String(err)}}}refresh();setInterval(refresh,3000)</script></html>
